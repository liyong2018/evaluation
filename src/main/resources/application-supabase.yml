spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres}
    username: ${SUPABASE_JDBC_USER:postgres}
    password: ${SUPABASE_JDBC_PASSWORD:password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: SELECT 1

mybatis-plus:
  type-aliases-package: com.evaluate.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  # 注册 TIMESTAMPTZ 处理器，避免 LocalDateTime 转换异常
  type-handlers-package: com.evaluate.config.typehandler

migration:
  enabled: false
  truncate: false
  exitOnFinish: false

