spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:30314/evaluate_db?useSSL=false&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${MYSQL_JDBC_USER:root}
    password: ${MYSQL_JDBC_PASSWORD:123456}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 10000
      validation-timeout: 5000
      keepalive-time: 30000
      connection-init-sql: SET NAMES utf8mb4
      data-source-properties:
        useUnicode: true
        characterEncoding: utf8
        characterSetResults: utf8mb4
        connectionCollation: utf8mb4_unicode_ci

mybatis-plus:
  type-aliases-package: com.evaluate.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  # MySQL 可不需要，但注册也不会有副作用
  type-handlers-package: com.evaluate.config.typehandler
