# 服务器配置
server:
  port: 8082
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring配置
spring:
  application:
    name: disaster-reduction-evaluation

  # 数据源配置 (使用Supabase PostgreSQL)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres
    username: postgres.olcdeeonmpjijxtvolum
    password: Htht@12#$

    # Hikari连接池配置
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
    
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis Plus配置
mybatis-plus:
  # 配置实体类包路径
  type-aliases-package: com.evaluate.entity
  # 全局配置
  global-config:
    db-config:
      # 主键类型 (PostgreSQL用INPUT，需要手动指定序列)
      id-type: INPUT
      # 逻辑删除字段
      logic-delete-field: is_deleted
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 字段验证策略
      insert-strategy: not_null
      update-strategy: not_null
      select-strategy: not_empty
  # 配置
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 开启缓存
    cache-enabled: false
    # 打印SQL（开启用于调试）
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 数据库方言适配
    database-id: postgresql

# 日志配置
logging:
  level:
    com.evaluate: info
    com.evaluate.mapper: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/evaluate.log
    max-size: 100MB
    max-history: 30

# Swagger配置
springfox:
  documentation:
    swagger-ui:
      enabled: true
    enabled: true

# Supabase配置
supabase:
  jdbc:
    url: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres
    user: postgres.olcdeeonmpjijxtvolum
    password: Htht@12#$

# 迁移配置 (已切换到Supabase，禁用迁移)
migration:
  enabled: false
  full:
    enabled: false
  truncate: false
  exitOnFinish: false

# 应用自定义配置