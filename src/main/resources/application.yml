# 服务器配置
server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring 公共配置（通过 profiles 切换数据源）
spring:
  application:
    name: disaster-reduction-evaluation
  profiles:
    active: mysql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis Plus 通用配置
mybatis-plus:
  type-aliases-package: com.evaluate.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# 日志配置
logging:
  level:
    com.evaluate: info
    com.evaluate.mapper: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/evaluate.log
    max-size: 100MB
    max-history: 30

# Swagger配置
springfox:
  documentation:
    swagger-ui:
      enabled: true
    enabled: true

# 数据迁移（默认禁用）
migration:
  enabled: false
  full:
    enabled: false
  truncate: false
  exitOnFinish: false

