# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring配置
spring:
  application:
    name: disaster-reduction-evaluation

  # 数据源配置 - 使用MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:30314/evaluate_db?useSSL=false&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 10000
      validation-timeout: 5000
      keepalive-time: 30000
      connection-init-sql: SET NAMES utf8mb4
      data-source-properties:
        useUnicode: true
        characterEncoding: utf8
        characterSetResults: utf8mb4
        connectionCollation: utf8mb4_unicode_ci

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis Plus配置
mybatis-plus:
  type-aliases-package: com.evaluate.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      insert-strategy: ignored

# 日志配置
logging:
  level:
    com.evaluate: info
    com.zaxxer.hikari: WARN
    org.springframework.jdbc: WARN
    org.springframework.transaction: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# Swagger配置
springfox:
  documentation:
    swagger-ui:
      enabled: true
    enabled: true
