## 上游后端（Spring Boot）
upstream app_servers {
    server evaluation-app:8087; # 容器/服务名为 evaluation-app，端口 8087
}

## HTTP 服务器
server {
    listen 80;                # 如宿主机暴露为 8088，请在容器/反向代理层映射到此端口
    server_name localhost;    # 根据实际域名或 IP 调整

    # 前端静态资源（Vue 构建产物）
    location / {
        root /usr/share/nginx/html;     # 将前端 dist 部署到此目录
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # SPA 路由回退，修复 /data-management 404
    }

    # API 接口代理到后端（保留原有设置）
    location /api/ {
        proxy_pass http://app_servers;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API特殊设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket 连接（如后端需要）
    location /ws/ {
        proxy_pass http://app_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket超时设置
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

