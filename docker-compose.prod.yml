version: '3.8'

services:
  backend:
    image: evaluation-backend:latest
    container_name: evaluation-backend
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=mysql
      - MYSQL_JDBC_URL=jdbc:mysql://evaluation-mysql:3306/evaluate_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - MYSQL_JDBC_USER=root
      - MYSQL_JDBC_PASSWORD=123456
      - INIT_ADMIN_USERNAME=admin
      - INIT_ADMIN_PASSWORD=123456
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - evaluation-network

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: evaluation-onlyoffice
    environment:
      - JWT_ENABLED=false
    restart: unless-stopped
    networks:
      - evaluation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: evaluation-frontend:latest
    container_name: evaluation-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - onlyoffice
    restart: unless-stopped
    networks:
      - evaluation-network

networks:
  evaluation-network:
    name: evaluation_evaluation-network
    external: true
