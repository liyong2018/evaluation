version: "3.8"

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: evaluation-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD: 123456
      - MYSQL_DATABASE: evaluate_db
      - MYSQL_CHARACTER_SET_SERVER: utf8mb4
      - MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - evaluation-network
    healthcheck:
      test: ["CMD", "mysqladmin", "-p", "123456", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: evaluation-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass "redis123"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - evaluation-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 后端应用（Spring Boot）
  app:
    build: .
    container_name: evaluation-app
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE: prod
      - SPRING_DATASOURCE_URL: jdbc:mysql://evaluation-mysql:3306/evaluate_db?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8
      - SPRING_DATASOURCE_USERNAME: root
      - SPRING_DATASOURCE_PASSWORD: 123456
      - SPRING_REDIS_HOST: evaluation-redis
      - SPRING_REDIS_PORT: 6379
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - evaluation-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 前端静态文件服务（独立容器）
  frontend:
    build: ./frontend
    container_name: evaluation-frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - evaluation-network

networks:
  evaluation-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local