version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: evaluation-backend
    ports:
      - "8082:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=mysql
      - MYSQL_JDBC_URL=jdbc:mysql://host.docker.internal:30314/evaluate_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - MYSQL_JDBC_USER=root
      - MYSQL_JDBC_PASSWORD=123456
      - INIT_ADMIN_USERNAME=admin
      - INIT_ADMIN_PASSWORD=123456
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - evaluation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evaluation-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - evaluation-network

volumes:
  mysql_data:
    driver: local

networks:
  evaluation-network:
    driver: bridge
