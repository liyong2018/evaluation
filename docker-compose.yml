version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: evaluation-backend
    ports:
      - "8082:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=mysql
      - MYSQL_JDBC_URL=jdbc:mysql://mysql:3306/evaluate_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - MYSQL_JDBC_USER=root
      - MYSQL_JDBC_PASSWORD=123456
      - INIT_ADMIN_USERNAME=admin
      - INIT_ADMIN_PASSWORD=123456
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      - evaluation-network

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: evaluation-onlyoffice
    environment:
      - JWT_ENABLED=false
    restart: unless-stopped
    networks:
      - evaluation-network

  mysql:
    image: mysql:8.0
    container_name: evaluation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evaluate_db
    ports:
      - "30314:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./evaluate_db_2025-11-12_215958.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    networks:
      - evaluation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evaluation-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
      - onlyoffice
    restart: unless-stopped
    networks:
      - evaluation-network

volumes:
  mysql_data:
    driver: local

networks:
  evaluation-network:
    driver: bridge
